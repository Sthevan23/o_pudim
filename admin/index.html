<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel — O! Pudim</title>
  <link rel="icon" href="../products/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css?v=4">
  <script>if (sessionStorage.getItem("admin_logged") !== "true") location.replace("login.html");</script>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__header"><img src="../products/logo.png" alt=""> O! Pudim</div>
    <nav class="sidebar__nav">
      <a href="#" class="sidebar__link active" data-page="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="#" class="sidebar__link" data-page="pedidos"><i class="fas fa-shopping-bag"></i> Pedidos</a>
      <a href="#" class="sidebar__link" data-page="produtos"><i class="fas fa-ice-cream"></i> Produtos</a>
      <a href="#" class="sidebar__link" data-page="clientes"><i class="fas fa-users"></i> Clientes</a>
      <a href="#" class="sidebar__link" data-page="financeiro"><i class="fas fa-chart-line"></i> Financeiro</a>
      <a href="#" class="sidebar__link" data-page="config"><i class="fas fa-cog"></i> Configurações</a>
    </nav>
    <div class="sidebar__footer">
      <a class="sidebar__link" href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> Ver site</a>
      <a class="sidebar__link" id="logout"><i class="fas fa-sign-out-alt"></i> Sair</a>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
      <h1 id="page-title">Dashboard</h1>
      <span class="admin-header__user" id="admin-email"></span>
    </header>

    <section class="admin-page active" id="page-dashboard">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-card__icon" style="background:#f5e6d3;color:#5a3825"><i class="fas fa-shopping-bag"></i></div><div><span class="stat-card__label">Pedidos</span><strong class="stat-card__value" id="stat-orders">0</strong></div></div>
        <div class="stat-card"><div class="stat-card__icon" style="background:#e8f5e9;color:#2e7d32"><i class="fas fa-dollar-sign"></i></div><div><span class="stat-card__label">Vendas</span><strong class="stat-card__value" id="stat-sales">R$ 0</strong></div></div>
        <div class="stat-card"><div class="stat-card__icon" style="background:#e3f2fd;color:#1565c0"><i class="fas fa-users"></i></div><div><span class="stat-card__label">Clientes</span><strong class="stat-card__value" id="stat-clients">0</strong></div></div>
        <div class="stat-card"><div class="stat-card__icon" style="background:#fff3e0;color:#ef6c00"><i class="fas fa-ice-cream"></i></div><div><span class="stat-card__label">Produtos ativos</span><strong class="stat-card__value" id="stat-products">0</strong></div></div>
      </div>
      <h2 class="section-title">Pedidos recentes</h2>
      <div class="order-list" id="dash-orders"></div>
    </section>

    <section class="admin-page" id="page-pedidos">
      <div class="order-list" id="orders-body"></div>
    </section>

    <section class="admin-page" id="page-produtos">
      <div class="toolbar">
        <h2 class="section-title" style="margin:0">Cardápio</h2>
        <button class="btn btn--primary" id="new-product"><i class="fas fa-plus"></i> Novo produto</button>
      </div>
      <div class="product-grid" id="products-body"></div>
    </section>

    <section class="admin-page" id="page-clientes">
      <div class="table-wrap"><table><thead><tr><th>Nome</th><th>WhatsApp</th><th>E-mail</th></tr></thead><tbody id="clients-body"></tbody></table></div>
    </section>

    <section class="admin-page" id="page-financeiro">
      <div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Valor</th></tr></thead><tbody id="finance-body"></tbody></table></div>
    </section>

    <section class="admin-page" id="page-config">
      <form class="page-card" id="settings-form">
        <div class="form-grid">
          <div class="form-group"><label>Nome</label><input id="s-name"></div>
          <div class="form-group"><label>WhatsApp (com DDI)</label><input id="s-wa"></div>
          <div class="form-group"><label>Instagram</label><input id="s-ig"></div>
          <div class="form-group"><label>@ do Instagram</label><input id="s-igu"></div>
          <div class="form-group full"><label>Endereço</label><input id="s-address"></div>
          <div class="form-group full"><label>Horário</label><input id="s-hours"></div>
          <div class="form-group full"><label>Texto sobre 1</label><textarea id="s-t1" rows="3"></textarea></div>
          <div class="form-group full"><label>Texto sobre 2</label><textarea id="s-t2" rows="3"></textarea></div>
          <div class="form-group full"><label><input type="checkbox" id="s-hide"> Esconder preços no site público</label></div>
        </div>
        <button class="btn btn--primary" type="submit">Salvar configurações</button>
      </form>
    </section>
  </main>

  <div class="modal" id="product-modal">
    <div class="modal__box">
      <h3 id="modal-title">Produto</h3>
      <form id="product-form">
        <input type="hidden" id="p-id">
        <div class="form-grid">
          <div class="form-group"><label>Nome</label><input id="p-name" required></div>
          <div class="form-group"><label>Categoria</label><select id="p-cat"></select></div>
          <div class="form-group full"><label>Descrição</label><textarea id="p-desc" rows="3"></textarea></div>
          <div class="form-group"><label>Preço</label><input id="p-price" type="number" step="0.01"></div>
          <div class="form-group"><label>Foto</label><input id="p-image" placeholder="products/..."></div>
          <div class="form-group full"><label>Enviar foto</label><input id="p-file" type="file" accept="image/*"></div>
          <div class="form-group"><label><input type="checkbox" id="p-active" checked> Visível no site</label></div>
          <div class="form-group"><label><input type="checkbox" id="p-feat"> Destaque</label></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
          <button type="button" class="btn btn--secondary" id="modal-close">Cancelar</button>
          <button class="btn btn--primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="../js/default-data.js?v=1"></script>
  <script src="../js/storage.js?v=1"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
